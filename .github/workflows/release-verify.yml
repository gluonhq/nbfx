# Independently verifies the files the release manager uploaded to a release (RELEASING.md, step 4).
#
#   - every .asc against KEYS, every .sha512, the licence files and Rat (ant release-verify)
#   - the source release is exactly `git archive` of the tag, rebuilt here on a clean runner
#   - the unpacked source release builds (fetching the pinned NetBeans revision)
#   - the binary starts on each platform it ships for: the shell is shown with native glass
#
# The checks run with the tooling (release/release.xml) and the KEYS of the default branch, so a fix
# to the tooling does not need a new tag; the tag is only the source the tarball is compared with.
#
# Runs when a release is published, or by hand on a draft before it is published:
#   gh workflow run release-verify.yml -f tag=0.1.0-rc1
# The result is posted on the release checklist issue.
name: Release verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (the release may still be a draft)
        required: true

permissions:
  # write: GitHub only shows draft releases to tokens that can push; nothing is written
  contents: write
  issues: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artefacts: ${{ steps.artefacts.outcome }}
      reproducible: ${{ steps.reproducible.outcome }}
      build: ${{ steps.build.outcome }}
    steps:
      - name: Version
        id: version
        run: |
          [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch the tag
        run: git fetch --depth 1 origin "+refs/tags/$TAG:refs/tags/$TAG"

      - name: Download the release files
        run: |
          mkdir -p build/release
          # gh api on the release list, filtered by tag, finds a draft as well as a published release
          release=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          [ -n "$release" ] || { echo "::error::no release (or draft) for $TAG"; exit 1; }
          gh api --paginate "repos/$GH_REPO/releases/$release/assets" --jq '.[] | select(.name | startswith("nbfx-")) | "\(.id) \(.name)"' \
            | while read -r id name; do
                # < /dev/null: gh would otherwise read the rest of the asset list from stdin
                gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" < /dev/null > "build/release/$name"
              done
          ls -l build/release
          [ -n "$(ls build/release)" ] || { echo "::error::the release $TAG has no nbfx-* files"; exit 1; }

      - uses: ./.github/actions/setup-build

      - name: Signatures, checksums, licence files, Rat
        id: artefacts
        # the version of the tag, not the default branch's (bumped after a release)
        run: ant release-verify -Dnbfx.version=${{ steps.version.outputs.version }}

      - name: The source release is git archive of the tag
        id: reproducible
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # compare the tar, not the gzip: gzip output may differ between git versions, the tar does not
          # the same -c options as release-src in release/release.xml
          ours=$(git -c core.autocrlf=false -c tar.umask=0002 archive --format=tar --prefix="nbfx-$VERSION/" "refs/tags/$TAG" \
                 | sha512sum | cut -d' ' -f1)
          theirs=$(gzip -dc "build/release/nbfx-$VERSION-src.tar.gz" | sha512sum | cut -d' ' -f1)
          echo "git archive of $TAG: $ours"
          echo "uploaded tarball:     $theirs"
          [ "$ours" = "$theirs" ] || { echo "::error::the uploaded source release is not git archive of $TAG"; exit 1; }

      - name: The source release builds
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar xzf "build/release/nbfx-$VERSION-src.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nbfx-$VERSION"
          # as ci.yml: HTTPS to OSUOSL is unreachable from GitHub runners
          ant -Dbinaries.server=http://netbeans.osuosl.org/binaries/ build

      - uses: ./.github/actions/save-build-cache
        if: always()

  # Starts the binary on each platform with an empty userdir and native glass. NBFX_BUDGET makes
  # the application write its startup marks once the shell is shown and then exit
  # (docs/w0-budget-baseline.md), so a written file with a "usable" mark means it came up.
  # Not covered: the macOS quarantine path of a zip downloaded through a browser (RELEASING.md §3).
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macOS aarch64, os: macos-latest, launcher: bin/netbeans }
          - { platform: macOS x64, os: macos-15-intel, launcher: bin/netbeans }
          - { platform: Windows x64, os: windows-latest, launcher: bin/netbeans64.exe }
          - { platform: Linux x64, os: ubuntu-latest, launcher: bin/netbeans, xvfb: true }
    name: Binary starts (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the binary
        run: |
          release=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          [ -n "$release" ] || { echo "::error::no release (or draft) for $TAG"; exit 1; }
          id=$(gh api --paginate "repos/$GH_REPO/releases/$release/assets" \
                 --jq '.[] | select(.name | test("^nbfx-.*-bin\\.zip$")) | .id' | head -1)
          [ -n "$id" ] || { echo "::error::the release $TAG has no nbfx-*-bin.zip"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > "$RUNNER_TEMP/bin.zip"
          mkdir "$RUNNER_TEMP/dist"
          unzip -q "$RUNNER_TEMP/bin.zip" -d "$RUNNER_TEMP/dist"

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '25'

      - name: Start with an empty userdir
        env:
          LAUNCHER: ${{ matrix.launcher }}
          XVFB: ${{ matrix.xvfb }}
        run: |
          # the launcher takes native paths; bash on Windows sees /d/a/... ones
          native() { if command -v cygpath > /dev/null; then cygpath -w "$1"; else echo "$1"; fi; }
          dist=$(echo "$RUNNER_TEMP"/dist/nbfx-*)
          userdir="$RUNNER_TEMP/userdir"
          budget="$RUNNER_TEMP/budget.json"
          export NBFX_BUDGET=$(native "$budget")
          wrap=(); [ "$XVFB" = true ] && wrap=(xvfb-run --auto-servernum)
          "${wrap[@]}" "$dist/$LAUNCHER" --jdkhome "$(native "$JAVA_HOME")" --userdir "$(native "$userdir")" &
          pid=$!
          # budget mode exits by itself once the shell is shown; the loop is only the timeout
          for _ in $(seq 300); do
            kill -0 "$pid" 2> /dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2> /dev/null; then
            echo "::error::the application did not exit within 5 minutes"
            kill "$pid" || true
          fi
          wait "$pid" || echo "launcher exit status $?"
          log="$userdir/var/log/messages.log"
          mkdir -p "$RUNNER_TEMP/smoke" && cp "$log" "$budget" "$RUNNER_TEMP/smoke/" 2> /dev/null || true
          status=0
          [ -f "$log" ] || { echo "::error::no $log: the platform did not start"; status=1; }
          grep -q '"usable"' "$budget" 2> /dev/null \
            || { echo "::error::no 'usable' mark in $budget: the shell was not shown"; status=1; }
          if [ -f "$log" ] && grep -nE 'was needed and not found|NoClassDefFoundError|UnsatisfiedLinkError|Graphics Device initialization failed|Error initializing QuantumRenderer|No toolkit found' "$log"; then
            echo "::error::messages.log reports missing modules, classes or natives"
            status=1
          fi
          [ -f "$budget" ] && cat "$budget"
          exit $status

      - name: Keep messages.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  report:
    needs: [verify, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report on the release checklist issue
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARTEFACTS: ${{ needs.verify.outputs.artefacts }}
          REPRODUCIBLE: ${{ needs.verify.outputs.reproducible }}
          BUILD: ${{ needs.verify.outputs.build }}
          SMOKE: ${{ needs.smoke.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release nbfx $VERSION"
          issue=$(gh issue list --state open --label release --search "\"$title\" in:title" \
                    --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$issue" ]; then
            echo "no open issue '$title'; not reporting"
            exit 0
          fi
          mark() { case "$1" in success) echo ":white_check_mark:";; skipped|'') echo ":heavy_minus_sign: not run";; *) echo ":x: $1";; esac; }
          gh issue comment "$issue" --body "$(cat <<EOF
          **Release verify for $TAG** ([run]($RUN))

          | Check | Result |
          |---|---|
          | signatures against \`KEYS\`, checksums, licence files, Rat (\`ant release-verify\`) | $(mark "$ARTEFACTS") |
          | source release is \`git archive\` of the tag | $(mark "$REPRODUCIBLE") |
          | source release builds (\`ant build\`) | $(mark "$BUILD") |
          | binary starts with native glass on macOS aarch64/x64, Windows x64, Linux x64 | $(mark "$SMOKE") |
          EOF
          )"
