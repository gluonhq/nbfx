OpenIDE-Module-Name=NetBeansFX IDE Diff
Diff.title={0} [ Diff ]
Diff.identical=No differences
Diff.differences={0,choice,1#1 difference|1<{0} differences}
Diff.loading=Comparing...
Diff.failed=The files could not be compared
Diff.previous=Previous Difference
Diff.next=Next Difference
Diff.refresh=Refresh
Diff.noChanges=No changes
Diff.column.file=File
Diff.column.status=Status
Diff.column.location=Path
Diff.view.list=List View
Diff.view.tree=Tree View
# {0} - what the button does, {1} - the keys that do the same
Diff.tooltip={0} ({1})
# {0} - the block the view is at, {1} - how many there are
Diff.counter={0}/{1}
# {0} - the number of the block, {1} - how many there are, {2} - what happened to its lines
Diff.mark=Go to difference {0} of {1}: {2}
Diff.added=Added: there is no file to compare with
Diff.deleted=Deleted: the file is no longer there
# What assistive technology says of the lines of a text that differ.
# {0} - the first line, {1} - the last line, {2} - how many lines
Diff.told.added={2,choice,1#Line {0} added|1<Lines {0} to {1} added}
Diff.told.deleted={2,choice,1#Line {0} deleted|1<Lines {0} to {1} deleted}
Diff.told.changed={2,choice,1#Line {0} changed|1<Lines {0} to {1} changed}
# {0} - the line after which the lines of the other text would go; 0 for the top
Diff.told.addedAfter=Lines added after line {0}
Diff.told.deletedAfter=Lines deleted after line {0}
# {0} - the heading of the side, {1} - why it cannot be compared
Diff.unreadable={0}: {1}
Diff.graphical=Graphical
Diff.textual=Textual
# {0} - the title of the left side, {1} - how its lines end, {2} - the title of the right side, {3} - how its lines end
Diff.lineEndings=Only line endings differ: {1} in {0}, {3} in {2}
# {0} - how much the texts differ, {1} - what else differs
Diff.withNote={0}. {1}
Diff.graphical.tip=The two texts side by side
Diff.textual.tip=The differences as a unified diff
# {0} - the number of lines that differ
Diff.textual.tooLarge=Too much differs to show as text: {0} lines
Diff.textual.failed=The differences could not be shown as text
Diff.revert=Revert Block
Diff.revertAll=Revert All
