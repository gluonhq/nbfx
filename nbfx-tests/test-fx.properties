# The headless JavaFX JVM properties every FX test module needs. Loaded from the module's
# build.xml before projectized.xml, so the test-unit-sys-prop.* values reach the test JVM.
# The properties are not inherited from a test dependency; this file is the one definition.
test-unit-sys-prop.glass.platform=Headless
test-unit-sys-prop.prism.order=sw
test-unit-sys-prop.java.library.path=${basedir}/../../nbfx-libs/libs.nbfx.javafx/release/modules/lib${path.separator}${netbeans.dest.dir}/modules/lib
