# Brandable theme settings. A brand that overrides this module resource changes the defaults
# without touching code.

# Follow the operating system color scheme by default.
theme.followSystem=true

# The theme used when no mode-specific theme applies.
theme.default=light

# The theme used for the two system modes.
theme.light=light
theme.dark=dark

# Color scheme of the bundled themes; user themes may add <id>.properties with scheme=dark.
theme.scheme.light=LIGHT
theme.scheme.dark=DARK
theme.scheme.solarized-dark=DARK
theme.scheme.high-contrast=DARK

# The theme files bundled with this module. A user file with the same id in nbfx-themes
# overlays the bundled one.
theme.bundled=light.css,dark.css,solarized-dark.css,high-contrast.css,template.css
