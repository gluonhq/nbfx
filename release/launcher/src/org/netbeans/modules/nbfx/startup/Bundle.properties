# The start-up check of the binary release (JdkCheck, NoImport). The jar is no module, so its
# messages are listed here rather than in @NbBundle.Messages; NbBundle (platform/lib) is on the
# startup classpath, like these classes.
JdkCheck.title=Error
JdkCheck.exit=Exit
# {0} the JDK nbfx needs, {1} the running Java version, {2} its java.home.
# The lines indented by four spaces are commands: the dialog shows them in a monospaced font.
JdkCheck.problem=nbfx needs JDK {0} or later, but was started with Java {1} ({2}).\n\
\n\
Start it with a JDK {0}, either on the command line:\n\
\    bin/netbeans --jdkhome <path to JDK {0}>\n\
\    bin\\netbeans64.exe --jdkhome <path to JDK {0}>\n\
or for every start, by setting netbeans_jdkhome in etc/netbeans.conf.
