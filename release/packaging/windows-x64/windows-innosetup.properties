# nbpackage configuration: the Windows x64 installer (Inno Setup), nbfx-<version>-x86_64.exe.
# See ../README.md. Keys are those of `nbpackage --type windows-innosetup --save-config`.
# The installer's shortcuts start bin\netbeans64.exe; the bundled JDK is passed with --jdkhome.

# Application name (required). Also the install directory and Start menu entry.
package.name=nbfx

# Application version; the workflow passes the released version with -Pversion=.
package.version=0.1.0

# Packaging type.
package.type=windows-innosetup

# Path to Java runtime to include in the package (default none). The file pinned in
# ../runtimes.properties, downloaded next to this file.
package.runtime=${CONFIG}/downloads/openjdk-27.0.1.0.3_windows-x64_bin.zip

# Override detected architecture. Leave blank to detect from runtime or configuration.
package.arch=

# A single-line description of the package. Not all packagers will display this.
package.description=nbfx ${package.version}: NetBeans on JavaFX

# Application publisher. Not all packagers will display this.
package.publisher=Gluon

# Link to application / publisher website. Not all packagers will display this.
package.url=https://github.com/gluonhq/nbfx

# Path to directory or zip of additional files to merge into image before package building.
package.merge=

# Glob pattern of files to remove from the image before package building.
package.remove=

# Path to an InnoSetup compiler - can be downloaded from https://jrsoftware.org/isinfo.php (or
# Linux shell script to invoke via wine). The default install location, which the GitHub Windows
# runners have; pass -Pinnosetup.tool=<path> for another.
package.innosetup.tool=C:/Program Files (x86)/Inno Setup 6/ISCC.exe

# ID to uniquely identify application. Defaults to package name.
package.innosetup.appid=com.gluonhq.nbfx

# Path to an icon (*.ico) file for shortcut and installer. Defaults to the Apache NetBeans logo.
package.innosetup.icon=

# Optional path to a license file to be shown during installation (*.txt or *.rtf).
package.innosetup.license=

# Optional path to an alternative InnoSetup (*.iss) file template.
package.innosetup.template=
