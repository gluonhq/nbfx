# nbpackage configuration: the macOS (Apple silicon) installer, nbfx-<version>-arm64.pkg.
# See ../README.md. Keys are those of `nbpackage --type macos-pkg --save-config`.

# Application name (required). Also the name of the .app bundle and the menu bar title.
package.name=nbfx

# Application version; the workflow passes the released version with -Pversion=.
package.version=0.1.0

# Packaging type.
package.type=macos-pkg

# Path to Java runtime to include in the package (default none). The file pinned in
# ../runtimes.properties, downloaded next to this file. The bundle's launcher starts bin/netbeans
# with --jdkhome pointing at it (Contents/Home).
package.runtime=${CONFIG}/downloads/openjdk-27.0.1.0.3_macos-aarch64_bin.tar.gz

# Override detected architecture. Leave blank to detect from runtime or configuration.
package.arch=

# A single-line description of the package. Not all packagers will display this.
package.description=nbfx ${package.version}: NetBeans on JavaFX

# Application publisher. Not all packagers will display this.
package.publisher=Gluon

# Link to application / publisher website. Not all packagers will display this.
package.url=https://github.com/gluonhq/nbfx

# Path to directory or zip of additional files to merge into image before package building.
package.merge=

# Glob pattern of files to remove from the image before package building.
package.remove=

# Value for CFBundleIdentifier.
package.macos.bundleid=com.gluonhq.nbfx

# Path to icon file (*.icns). Defaults to Apache NetBeans logo.
package.macos.icon=

# Optional path to Info.plist template.
package.macos.info-template=

# Optional path to launcher (main.swift) template.
package.macos.launcher-template=

# Optional path to codesign entitlements template.
package.macos.entitlements-template=

# Search pattern for native binaries that need to be code signed. The JavaFX natives are plain
# files under nbfx-libs/modules/lib (*.dylib), the JDK's binaries under Contents/Home.
package.macos.codesign-files={*.dylib,*.jnilib,**/nativeexecution/MacOSX-*/*,Contents/Home/bin/*,Contents/Home/lib/jspawnhelper}

# Search pattern for JARs that bundle native binaries that need to be code signed.
package.macos.codesign-jars={flatlaf-*.jar,jna-5*.jar,junixsocket-native-common-*.jar,launcher-common-*.jar,jansi-*.jar,nbi-engine.jar,truffle-runtime-*.jar}

# Code signing identity as passed to Codesign ("Developer ID Application: ..."). Empty: unsigned.
# The workflow passes both identities from its secrets with -Pmacos.codesign-id= and
# -Pmacos.pkgbuild-id=, and notarizes the result.
package.macos.codesign-id=

# Installer signing identity as passed to Pkgbuild ("Developer ID Installer: ...").
package.macos.pkgbuild-id=
