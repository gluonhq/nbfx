# The downloads the packages bundle, pinned by URL and SHA-256 (see README.md).
#
# The workflow (.github/workflows/packages.yml) fetches each file into
# <platform>/downloads/<file>, where the packager configuration of that platform expects it;
# for a local build, download it there by hand and check the sum.
#
# nbpackage reads the architecture from the file name (x64/x86_64/amd64, aarch64/arm64), so the
# file names are the vendors' own. There is no macOS x64 package: jdk.java.net has no JDK 27 for
# it (the port is deprecated since JDK 27 and Oracle no longer builds it), and the zip serves
# that platform with a JDK of the user's own.

jdk.version=27.0.1

jdk.macos-aarch64.file=openjdk-27.0.1.0.3_macos-aarch64_bin.tar.gz
jdk.macos-aarch64.url=https://download.java.net/java/GA/jdk27.0.1.0.3/b14170c9b2de463d9b89442c6db3e384/1/GPL/openjdk-27.0.1.0.3_macos-aarch64_bin.tar.gz
jdk.macos-aarch64.sha256=5d6832ad0ed8a027faff4f5a933d2da30b6740ad89e9341b9676957aa269da2e

jdk.windows-x64.file=openjdk-27.0.1.0.3_windows-x64_bin.zip
jdk.windows-x64.url=https://download.java.net/java/GA/jdk27.0.1.0.3/b14170c9b2de463d9b89442c6db3e384/1/GPL/openjdk-27.0.1.0.3_windows-x64_bin.zip
jdk.windows-x64.sha256=028d4866d96312a25fc5dd8c1bc107f6f365ef8a9ff32b7e0687257623a7f98f

jdk.linux-x64.file=openjdk-27.0.1.0.3_linux-x64_bin.tar.gz
jdk.linux-x64.url=https://download.java.net/java/GA/jdk27.0.1.0.3/b14170c9b2de463d9b89442c6db3e384/1/GPL/openjdk-27.0.1.0.3_linux-x64_bin.tar.gz
jdk.linux-x64.sha256=256199399aaddc6d66919b5de90794b4263e4ab312aa56692cb63b70a0abef41

