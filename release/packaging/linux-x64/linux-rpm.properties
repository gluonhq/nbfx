# nbpackage configuration: the Linux x64 RPM package, nbfx-<version>.x86_64.rpm.
# See ../README.md. Keys are those of `nbpackage --type linux-rpm --save-config`.
# Needs rpm and rpmbuild (Debian/Ubuntu: `apt-get install rpm`). The package installs under
# /opt and its launcher script starts bin/netbeans with --jdkhome pointing at the bundled JDK.

# Application name (required).
package.name=nbfx

# Application version; the workflow passes the released version with -Pversion=.
package.version=0.1.0

# Packaging type.
package.type=linux-rpm

# Path to Java runtime to include in the package (default none). The file pinned in
# ../runtimes.properties, downloaded next to this file.
package.runtime=${CONFIG}/downloads/openjdk-27.0.1.0.3_linux-x64_bin.tar.gz

# Override detected architecture. Leave blank to detect from runtime or configuration.
package.arch=

# A single-line description of the package. Not all packagers will display this.
package.description=nbfx ${package.version}: NetBeans on JavaFX

# Application publisher. Not all packagers will display this.
package.publisher=Gluon

# Link to application / publisher website. Not all packagers will display this.
package.url=https://github.com/gluonhq/nbfx

# Path to directory or zip of additional files to merge into image before package building.
package.merge=

# Glob pattern of files to remove from the image before package building.
package.remove=

# Path to 48x48 png icon as required by xdg specification. Defaults to Apache NetBeans logo.
package.rpm.icon=

# Path to SVG icon. Will only be used if package.rpm.icon also set. Defaults to Apache NetBeans logo.
package.rpm.svg-icon=

# Optional name for .desktop file (without suffix). Defaults to sanitized package name.
package.rpm.desktop-filename=nbfx

# StartupWMClass to set in .desktop file. Should match the WMClass of the main application window.
# To check: `xprop WM_CLASS` on the running window. A mismatch only affects dock grouping.
package.rpm.wmclass=nbfx

# Application category (or categories) to use in the .desktop file.
package.rpm.category=Development;IDE;Java;

# Maintainer information as name and email.
package.rpm.maintainer=Gluon <nbfx@gluonhq.com>

# Application license type (for "License" field in RPM spec file): nbfx and NetBeans are
# Apache-2.0, the bundled JDK and JavaFX GPL-2.0 with the Classpath exception.
package.rpm.license=Apache-2.0 AND GPL-2.0-only WITH Classpath-exception-2.0

# RPM group.
package.rpm.group=Development/Tools/IDE

# Optional path to custom spec file template.
package.rpm.spec-template=

# Optional path to custom .desktop file template.
package.rpm.desktop-template=

# Optional path to custom launcher script template.
package.rpm.launcher-template=
